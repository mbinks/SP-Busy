name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create plugin ZIP
        run: |
          cd sp-plugin
          zip -r ../sp-plugin.zip .
          cd ..
          ls -lh sp-plugin.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: BusyBar Status Sync v${{ github.event.inputs.version }}
          body: |
            ## BusyBar Status Sync v${{ github.event.inputs.version }}

            Sync SuperProductivity task timer status with BusyBar. Automatically update your BusyBar status when you start/stop tasks.

            ### Features
            - ✅ Automatic status updates (task start/stop)
            - ✅ Custom automation rules
            - ✅ Timer-based triggers
            - ✅ Idle state monitoring
            - ✅ Secure token storage (never synced)

            ### Installation
            1. Download `sp-plugin.zip` from the Assets section below
            2. In Super Productivity: **Settings > Plugins > Upload Plugin**
            3. Select the ZIP file
            4. Click "BusyBar Status Sync" in the sidebar
            5. Go to Settings and enter your BusyBar API token
            6. Click "Test Connection" to verify

            ### Requirements
            - Super Productivity v10+
            - BusyBar account with API access

            See [README](https://github.com/${{ github.repository }}/blob/main/sp-plugin/README.md) for full documentation.
          files: sp-plugin.zip
          draft: false
          prerelease: false
          generate_release_notes: false
